name: DevMonitor Android Cloud Build

on: [workflow_dispatch, push]

jobs:
  build-debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find DevMonitor ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name 'DevMonitor-*.zip' | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "DevMonitor ZIP not found."
            exit 1
          fi
          echo "Using: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract DevMonitor project
        run: |
          rm -rf build-source
          mkdir -p build-source
          unzip -q "$ZIP_FILE" -d build-source

      - name: Locate Android project
        run: |
          echo "Searching for Gradle project..."
          find build-source -maxdepth 3 -name gradlew -type f -print
          PROJECT_DIR=$(dirname "$(find build-source -maxdepth 3 -name gradlew -type f | head -n 1)")
          if [ -z "$PROJECT_DIR" ]; then
            echo "Gradle wrapper not found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build DevMonitor debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload DevMonitor APK
        uses: actions/upload-artifact@v4
        with:
          name: DevMonitor-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
