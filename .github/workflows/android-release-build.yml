name: DevMonitor Android Release Cloud Build

on:
  workflow_dispatch:
  push:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Select DevMonitor ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""

          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            mapfile -t CHANGED_ZIPS < <(
              git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" |
              grep -E '^DevMonitor-.*\.zip$' || true
            )

            if [ "${#CHANGED_ZIPS[@]}" -gt 0 ]; then
              ZIP_FILE="$(
                printf '%s\n' "${CHANGED_ZIPS[@]}" |
                sort -V |
                tail -n 1
              )"
            fi
          fi

          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(
              find . \
                -maxdepth 1 \
                -type f \
                -name 'DevMonitor-*.zip' \
                -printf '%f\n' |
              sort -V |
              tail -n 1
            )"
          fi

          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: No DevMonitor ZIP was found."
            exit 1
          fi

          echo "Selected ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract DevMonitor project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build-source
          mkdir -p build-source

          unzip -q "$ZIP_FILE" -d build-source

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          GRADLEW="$(
            find build-source \
              -maxdepth 5 \
              -type f \
              -name 'gradlew' |
            head -n 1
          )"

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found in selected ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Project directory: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Read DevMonitor version
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          elif [ -f "$PROJECT_DIR/app/build.gradle" ]; then
            BUILD_FILE="$PROJECT_DIR/app/build.gradle"
          else
            echo "ERROR: app/build.gradle(.kts) not found."
            exit 1
          fi

          VERSION_NAME="$(
            grep -E \
              'versionName[[:space:]]*=[[:space:]]*"[^"]+"' \
              "$BUILD_FILE" |
            head -n 1 |
            sed -E \
              's/.*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/'
          )"

          VERSION_CODE="$(
            grep -E \
              'versionCode[[:space:]]*=[[:space:]]*[0-9]+' \
              "$BUILD_FILE" |
            head -n 1 |
            sed -E \
              's/.*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/'
          )"

          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "ERROR: Could not read versionName/versionCode."
            exit 1
          fi

          ARTIFACT_BASE="DevMonitor-${VERSION_NAME}-v${VERSION_CODE}-release"

          echo "========================================"
          echo "Selected ZIP : $ZIP_FILE"
          echo "Version Name : $VERSION_NAME"
          echo "Version Code : $VERSION_CODE"
          echo "Artifact     : ${ARTIFACT_BASE}.apk"
          echo "========================================"

          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "ARTIFACT_BASE=$ARTIFACT_BASE" >> "$GITHUB_ENV"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore release keystore
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail

          KEYSTORE_FILE="$RUNNER_TEMP/fieldpulse-release.jks"

          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "ERROR: RELEASE_KEYSTORE_BASE64 secret is missing."
            exit 1
          fi

          printf '%s' "$RELEASE_KEYSTORE_BASE64" |
            base64 --decode > "$KEYSTORE_FILE"

          if [ ! -s "$KEYSTORE_FILE" ]; then
            echo "ERROR: Release keystore could not be restored."
            exit 1
          fi

          echo "RELEASE_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"

      - name: Make Gradle wrapper executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build signed release APK with Drive configuration
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        env:
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          RELEASE_KEYSTORE_FILE: ${{ env.RELEASE_KEYSTORE_FILE }}
          DRIVE_REPORT_API_KEY: ${{ secrets.DRIVE_REPORT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$DRIVE_REPORT_API_KEY" ]; then
            echo "ERROR: DRIVE_REPORT_API_KEY GitHub Secret is missing or empty."
            exit 1
          fi

          if [ -z "$RELEASE_KEY_ALIAS" ] || \
             [ -z "$RELEASE_STORE_PASSWORD" ] || \
             [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "ERROR: One or more release-signing secrets are missing."
            exit 1
          fi

          ./gradlew \
            assembleRelease \
            -Pandroid.injected.signing.store.file="$RELEASE_KEYSTORE_FILE" \
            -Pandroid.injected.signing.store.password="$RELEASE_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$RELEASE_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$RELEASE_KEY_PASSWORD" \
            -PDRIVE_REPORT_API_KEY="$DRIVE_REPORT_API_KEY" \
            --stacktrace

      - name: Verify Online Reports configuration was compiled
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          BUILD_CONFIG="$(
            find app/build/generated \
              -type f \
              \( -name 'BuildConfig.java' -o -name 'BuildConfig.kt' \) \
              -path '*release*' |
            head -n 1
          )"

          if [ -z "$BUILD_CONFIG" ] || [ ! -f "$BUILD_CONFIG" ]; then
            echo "ERROR: Release BuildConfig file was not found; cannot verify Drive configuration."
            exit 1
          fi

          if ! grep -Fq 'DRIVE_REPORT_API_KEY' "$BUILD_CONFIG"; then
            echo "ERROR: Drive API key field is missing from release BuildConfig."
            exit 1
          fi

          if grep -Eq 'DRIVE_REPORT_API_KEY[[:space:]]*=[[:space:]]*""' "$BUILD_CONFIG"; then
            echo "ERROR: Drive API key compiled as empty."
            exit 1
          fi

          echo "Online Reports API key field is present in release BuildConfig (value hidden)."

      - name: Locate and rename APK
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_DIR/app/build/outputs/apk/release"

          APK_FILE="$(
            find "$APK_DIR" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' |
            head -n 1
          )"

          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK was not produced."
            exit 1
          fi

          FINAL_APK="$APK_DIR/${ARTIFACT_BASE}.apk"

          mv "$APK_FILE" "$FINAL_APK"

          echo "========================================"
          echo "APK CREATED"
          echo "========================================"
          echo "APK: $FINAL_APK"
          echo "========================================"

          echo "FINAL_APK=$FINAL_APK" >> "$GITHUB_ENV"

      - name: Upload DevMonitor release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_BASE }}
          path: ${{ env.FINAL_APK }}
          if-no-files-found: error
          retention-days: 14

      - name: Build summary
        shell: bash
        run: |
          echo "========================================"
          echo "RELEASE BUILD COMPLETE"
          echo "========================================"
          echo "Version : $VERSION_NAME"
          echo "Code    : $VERSION_CODE"
          echo "APK     : ${ARTIFACT_BASE}.apk"
          echo "Source  : $ZIP_FILE"
          echo "Signing : fieldpulse-release"
          echo "Drive   : API key supplied and BuildConfig checked (value hidden)"
          echo "========================================"
